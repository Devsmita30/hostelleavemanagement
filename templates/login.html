{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Leave Management System</title>

    <!-- Bootstrap -->
    <link href="https://jsdelivr.net" rel="stylesheet">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.75) 0%, rgba(15, 23, 42, 0.85) 100%), url("{% static 'images/guni_campus.png' %}");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }

        /*Floating Glass Container for the Logo */
        .logo-container {
            text-align: center;
            padding-top: 35px;
            padding-bottom: 20px;
        }

        .logo {
            max-width: 90%;
            height: auto;
            max-height: 85px;
            object-fit: contain;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 10px 20px 40px; /* Increased bottom padding */
        }

        .main-container h1 {
            margin-top: 10px;  
            margin-bottom: 10px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .main-container p.subtitle {
            margin-bottom: 40px;
            color: #94A3B8 !important;
            font-size: 1.05rem;
        }
        
        /* Mobile View */
        .diamond-matrix {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 340px;
            margin: 0 auto 30px; /* Added margin space to prevent footer collisions */
        }

        /* Laptop/Desktop View */
        @media (min-width: 992px) {
            .diamond-matrix {
                display: grid;
                grid-template-columns: repeat(3, 260px); 
                grid-template-rows: repeat(3, 150px);    
                gap: 20px;
                max-width: 900px;
                height: auto; 
                justify-content: center;
                align-content: center;
                margin-bottom: 50px;
            }

            .slot-student {
                grid-column: 2;
                grid-row: 1;
            }
            .slot-rector {
                grid-column: 1;
                grid-row: 2;
            }
            .slot-proctor {
                grid-column: 3;
                grid-row: 2;
            }
            .slot-hod {
                grid-column: 2;
                grid-row: 3;
            }
        }

        .role-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
            background: rgba(30, 41, 59, 0.5); 
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            text-decoration: none;
            height: 100%; 
            min-height: 130px;
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, background-color 0.3s ease;
        }

        .role-card:hover {
            transform: translateY(-6px) scale(1.03);
            background: rgba(30, 41, 59, 0.75);
            border-color: rgba(255, 255, 255, 0.20);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .role-card h4 {
            color: #FFFFFF;
            font-weight: 600;
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .role-card p {
            color: #CBD5E1;
            font-weight: 400;
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        .student-card { border-top: 4px solid #3B82F6; }   
        .rector-card { border-top: 4px solid #22C55E; }    
        .proctor-card { border-top: 4px solid #F97316; }   
        .hod-card { border-top: 4px solid #A855F7; }       

        .footer {
            text-align: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: #64748B;
            margin-top: auto; 
        }

        @media (max-width: 991px) {
            .main-container h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="logo-container">
    <img src="{% static 'images/logo.png' %}" alt="Ganpat University Logo" class="logo">
</div>

<div class="container main-container">

    <h1 class="fw-bold">Hostel Leave Management System</h1>
    <p class="subtitle">Manage hostel leave applications easily and securely</p>

    <div class="diamond-matrix">
        
        <div class="slot-student">
            <a href="{% url 'student_login' %}" class="role-card student-card">
                <h4>🎓 Student</h4>
                <p>Apply for Leave</p>
            </a>
        </div>

        <div class="slot-rector">
            <a href="{% url 'rector' %}" class="role-card rector-card">
                <h4>🏢 Rector</h4>
                <p>Verify & Approve</p>
            </a>
        </div>

        <div class="slot-proctor">
            <a href="{% url 'proctor' %}" class="role-card proctor-card">
                <h4>👨‍💼 Proctor</h4>
                <p>Approve Requests</p>
            </a>
        </div>

        <div class="slot-hod">
            <a href="{% url 'hod' %}" class="role-card hod-card">
                <h4>💼 HOD</h4>
                <p>Approve Requests</p>
            </a>
        </div>

    </div>

</div>

<div class="footer">
    &copy; 2026 Hostel Leave Management System
</div>

</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Leave Application Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f8fafc;
            font-family: Arial, sans-serif;
            color: #0f172a;
        }

        .main-container {
            width: min(100%, 980px);
            margin: 0 auto;
            padding: 24px;
            background-color: #ffffff;
        }

        .logo {
            width: 220px;
            max-width: 70%;
            height: auto;
        }

        .page-title h3 {
            margin-bottom: 8px;
            font-size: 32px;
            font-weight: 500;
        }

        .page-title p {
            margin-bottom: 0;
            font-size: 20px;
        }

        .section-title {
            font-weight: 700;
            margin: 28px 0 16px;
            color: #244e66;
            border-left: 5px solid #3a6073;
            padding-left: 10px;
            font-size: 20px;
        }

        label {
            margin-bottom: 6px;
            font-size: 16px;
        }

        .form-control,
        .form-select {
            min-height: 46px;
            font-size: 16px;
        }

        .travel-options {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 22px;
            padding-top: 8px;
        }

        .travel-options label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0;
        }

        .btn-submit {
            background-color: #3a6073;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn-submit:hover {
            background-color: #16222a;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 18px;
            }

            .page-title h3 {
                font-size: 26px;
            }

            .page-title p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>
    <main class="main-container">
        <div class="text-center mb-3">
            <img src="{% static 'images/logo.png' %}" class="logo" alt="University Logo">
        </div>

        <div class="text-center page-title mb-4">
            <h3>Leave Application Form</h3>
            <p>(Only for Hosteller)</p>
        </div>

        <form method="POST" class="needs-validation" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <section class="student-details">
                <div class="section-title">Student Details</div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" class="form-control" value="{{ student.full_name }}"
                            readonly required>
                    </div>

                    <div class="col-md-6">
                        <label for="enrollment">Enrollment Number *</label>
                        <input type="text" id="enrollment" name="enrollment" class="form-control"
                            value="{{ student.enrollment_no }}" readonly required>
                    </div>

                    <div class="col-md-6">
                        <label for="hostel">Hostel Name *</label>
                        <input type="text" id="hostel" name="hostel" class="form-control"
                            value="{{ student.hostel_block }}" readonly required>
                    </div>

                    <div class="col-md-6">
                        <label for="room">Room Number *</label>
                        <input type="text" id="room" name="room" class="form-control" value="{{ student.room_number }}"
                            readonly required>
                    </div>

                    <div class="col-md-6">
                        <label for="student_contact">Student Contact *</label>
                        <input type="tel" id="student_contact" name="student_contact" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="student_email">Student Email *</label>
                        <input type="email" id="student_email" name="student_email" class="form-control"
                            value="{{ student.email }}" readonly required>
                    </div>

                    <div class="col-md-6">
                        <label for="parent_name">Parent / Guardian Name *</label>
                        <input type="text" id="parent_name" name="parent_name" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="parent_phone">Parent / Guardian Phone *</label>
                        <input type="tel" id="parent_phone" name="parent_phone" class="form-control" required>
                    </div>
                </div>
            </section>

            <section class="leave-details">
                <div class="section-title">Leave Details</div>

                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="from_date">Start Date *</label>
                        <input type="date" id="from_date" name="from_date" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="to_date">End Date *</label>
                        <input type="date" id="to_date" name="to_date" class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label>Travel Mode *</label>
                        <div class="travel-options">
                            <label><input type="radio" name="travel_mode" value="Bus" required> Bus</label>
                            <label><input type="radio" name="travel_mode" value="Train"> Train</label>
                            <label><input type="radio" name="travel_mode" value="Flight"> Flight</label>
                            <label><input type="radio" name="travel_mode" value="Own Vehicle"> Own Vehicle</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="leave_address">Address During Leave *</label>
                        <textarea id="leave_address" name="leave_address" class="form-control" rows="2"
                            required></textarea>
                    </div>

                    <div class="col-12">
                        <label for="city_state_pin">City / State / PIN *</label>
                        <input type="text" id="city_state_pin" name="city_state_pin" class="form-control" required>
                    </div>

                    <div class="col-12">
                        <label for="reason">Reason *</label>
                        <textarea id="reason" name="reason" class="form-control" rows="3" required></textarea>
                    </div>
                </div>
            </section>

            <div class="text-center mt-4">
                <button type="submit" class="btn-submit">Submit Leave Request</button>
            </div>
        </form>
    </main>

    <script>
        (function () {
            'use strict';
            const forms = document.querySelectorAll('.needs-validation');
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        })();
    </script>
</body>

</html>
